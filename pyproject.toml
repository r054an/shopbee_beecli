[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shopbee"
version = "1.0.0"
description = "Bee Skill for Amazon Shopping — 'You said you needed it. Bee remembers.'"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Roshan R", email = "roshan@shopbee.dev"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/roshanrohith/shopbee"
Repository = "https://github.com/roshanrohith/shopbee"
Issues = "https://github.com/roshanrohith/shopbee/issues"
Changelog = "https://github.com/roshanrohith/shopbee/releases"

[project.scripts]
shopbee = "shopbee.skill:main"

[tool.setuptools.packages.find]
where = ["."]
